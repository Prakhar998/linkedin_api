version: '3.8'

services:
  linkedin-api:
    build: .
    ports:
      - "5000:5000"
    environment:
      - FLASK_ENV=development
      - FLASK_DEBUG=False
      - PORT=5000
      - HOST=0.0.0.0
      - LINKEDIN_CSRF_TOKEN=${LINKEDIN_CSRF_TOKEN}
      - LINKEDIN_LI_AT_COOKIE=${LINKEDIN_LI_AT_COOKIE}
    volumes:
      - .:/app
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s