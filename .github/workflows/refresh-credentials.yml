name: Refresh LinkedIn Credentials

on:
  schedule:
    # Run every Sunday at 2 AM UTC (adjust to your timezone)
    - cron: '0 2 * * 0'
  workflow_dispatch:  # Allow manual trigger from GitHub UI

jobs:
  refresh:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install requests

      - name: Check current credential status
        id: check
        run: |
          python3 << 'EOF'
          import requests
          import os

          # Get credentials from secrets
          csrf_token = "${{ secrets.LINKEDIN_CSRF_TOKEN }}"
          li_at_cookie = "${{ secrets.LINKEDIN_LI_AT_COOKIE }}"

          if not csrf_token or not li_at_cookie:
              print("::error::Credentials not configured in secrets")
              exit(1)

          # Test if credentials are valid
          session = requests.Session()
          session.cookies.set('li_at', li_at_cookie)
          session.headers['X-CSRF-Token'] = csrf_token

          try:
              response = session.get(
                  "https://www.linkedin.com/voyager/api/me",
                  timeout=10
              )

              if response.status_code == 200:
                  print("✅ Credentials still valid")
                  print("::set-output name=valid::true")
              else:
                  print(f"⚠️  Credentials returned {response.status_code}")
                  print("::set-output name=valid::false")
          except Exception as e:
              print(f"⚠️  Could not validate: {e}")
              print("::set-output name=valid::false")
          EOF

      - name: Create issue if credentials expired
        if: steps.check.outputs.valid == 'false'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '🔑 LinkedIn Credentials Expired',
              body: `
              **Credentials Status**: EXPIRED ❌

              LinkedIn session tokens have expired. Time to refresh!

              ### Steps to Refresh:

              1. **Locally** (on your computer):
                 \`\`\`bash
                 python3 refresh_credentials.py
                 \`\`\`
                 Follow the prompts to extract fresh credentials

              2. **Update Render**:
                 Go to https://dashboard.render.com
                 - Settings → Environment
                 - Update LINKEDIN_CSRF_TOKEN and LINKEDIN_LI_AT_COOKIE
                 - Save (auto-deploys)

              3. **Update GitHub Secrets**:
                 Go to Settings → Secrets and variables → Actions
                 - Update LINKEDIN_CSRF_TOKEN
                 - Update LINKEDIN_LI_AT_COOKIE

              4. **Verify**:
                 \`\`\`bash
                 curl https://your-api.onrender.com/api/v1/validate
                 \`\`\`
                 Should return: {"valid": true}

              ### Why This Happened
              LinkedIn session tokens expire after ~24 hours.
              GitHub Actions workflow automatically checks weekly.
              `
            })

      - name: Send notification
        if: steps.check.outputs.valid == 'false'
        run: |
          echo "::warning::LinkedIn credentials have expired!"
          echo "Run: python3 refresh_credentials.py to get fresh credentials"

      - name: Log success
        if: steps.check.outputs.valid == 'true'
        run: |
          echo "✅ Credentials still valid"
          echo "Next check: next Sunday"
